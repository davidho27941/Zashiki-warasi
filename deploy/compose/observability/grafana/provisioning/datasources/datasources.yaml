# Grafana datasource provisioning for the compose observability profile.
#
# Two datasources auto-connected on first boot:
#   - Prometheus (default): scrapes app + collector self-metrics
#   - Tempo: OTel traces from the app
#
# `traceToMetrics` and `tracesToLogs` cross-links are configured so
# Grafana Explore lets operators pivot from trace → metric (and later,
# trace → log once the Loki follow-up change lands).

apiVersion: 1

datasources:
  # ---- Prometheus (default) ----
  # `uid: prometheus` is REQUIRED — the bundled dashboard JSON hard-codes
  # `"uid": "prometheus"` in every panel's datasource reference. Without
  # this explicit uid, Grafana auto-generates one on first boot (e.g.
  # `PBFA97CFB590B2093`), the reference doesn't match, and every panel
  # renders "No data" despite Prometheus itself scraping correctly.
  # Same pattern as Tempo / Loki datasources below.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # Enable exemplars — reserved for future when we ship
      # OpenMetrics exposition (backlog).
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # ---- Tempo (traces) ----
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      # From a trace span, "Explore metrics for span" opens Prometheus
      # pre-filtered by service.name — operator jumps in one click.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
      # From a trace span, jump to logs in Loki for the same trace_id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true
      # nodeGraph shows the span-parent tree as a visual DAG in the
      # trace inspector.
      nodeGraph:
        enabled: true
      # search field is the primary UX in Tempo v2+
      search:
        hide: false
      serviceMap:
        datasourceUid: prometheus

  # ---- Loki (logs, v1.2 add-log-aggregation-loki) ----
  # Paired with the compose profile's `alloy` shipper (tails Docker
  # container stdout via /var/run/docker.sock) and the `loki` service.
  #
  # Derived field turns any log line's `trace_id` key into a clickable
  # link that opens the Tempo datasource pre-loaded with that trace's
  # span tree — the log→trace jump that makes the JSON log format's
  # trace-context fields (shipped in v1.1) operationally useful.
  #
  # Note: the URL uses `$${__value.raw}` (double $) because Grafana
  # provisioning treats a single `$` as an env-var expansion — see the
  # Grafana docs on "Using environment variables in the provisioning
  # file". Escaping preserves the literal Grafana template token.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'View trace in Tempo'
