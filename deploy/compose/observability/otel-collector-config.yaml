# OpenTelemetry Collector config for the compose observability profile.
#
# Data flow:
#   zashiki-warasi ──OTLP/gRPC──► collector ──OTLP/gRPC──► tempo
#                                    │
#                                    └──► /metrics (:8888, Prom scrape)
#
# The app never talks to Tempo directly — collector is the single
# egress hop, which lets operators swap Tempo for Jaeger / Honeycomb /
# any OTLP-compatible backend by editing this file only.

receivers:
  otlp:
    # Accept both gRPC (:4317) and HTTP (:4318) for compatibility with
    # any SDK / language runtime the operator might attach later. Our
    # own app uses gRPC.
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch spans before sending — reduces gRPC call count under bursts.
  # Defaults are fine for our volume (~1500 traces/day).
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

  # memory_limiter protects the collector from OOM if downstream
  # (Tempo) slows down. Trips at 80% of the container's memory limit.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Forward spans to Tempo (compose service on the same network).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Self-metrics: the collector exposes its own scrape target on :8888
  # via the `prometheus` extension below (NOT this exporter — this is
  # for the app-metric passthrough if we ever add one).
  debug:
    verbosity: basic

extensions:
  # Health + zpages for operator introspection.
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  # Collector self-telemetry exposed on :8888 (Prometheus scrape) so
  # operators can watch collector health from the same Grafana dashboard
  # as the app's own metrics.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

  extensions: [health_check, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
