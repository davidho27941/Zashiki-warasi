# Default values for zashiki-warasi.
# Override on the CLI: `helm install ... -f myvalues.yaml`.

image:
  repository: zashiki-warasi
  tag: "1.0.0"           # pin an explicit tag — `latest` bites hard on rollbacks
  pullPolicy: IfNotPresent

# k8s imagePullSecrets, needed when the image lives in a private
# registry (GitLab / Harbor / GHCR-private / ECR). Supply an existing
# Secret name; the chart doesn't create the Secret itself so it can be
# rotated + shared across releases.
#
# Create with:
#   kubectl create secret docker-registry regcred \
#       --docker-server=registry.gitlab.example.com \
#       --docker-username=<user> \
#       --docker-password=<token> \
#       --namespace=<ns>
imagePullSecrets: []
# imagePullSecrets:
#   - name: regcred

# Deployment shape. The app coordinates across replicas via a Postgres
# advisory lock (`POST /poll` single-flight) + Postgres-backed OAuth
# flow store, so `replicaCount > 1` is safe and only means "HA HTTP
# surface" — tick throughput is unchanged (still one tick in flight
# system-wide). See design D17 in the migrate-to-fastapi-service
# openspec change.
#
# BEFORE raising this above 1: check `persistence.accessMode` below.
# The default ReadWriteOnce PVC only attaches to one node — a second
# pod scheduled to a different node will hit `MultiAttach error`.
# For multi-node HA you need `persistence.accessMode: ReadWriteMany`
# AND a storage class that supports it (Longhorn share-manager, NFS,
# CephFS, EFS, ...).
replicaCount: 1

# Rolling updates are safe at any replica count — advisory lock
# guarantees no double-tick during pod overlap.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ---------- Non-secret env (rendered into a ConfigMap) ----------
env:
  HTTP_BIND_HOST: "0.0.0.0"
  HTTP_BIND_PORT: "8080"
  # OAUTH_REDIRECT_URI must be reachable from the operator's browser
  # AND registered in the Google Cloud Console. For a Service-only
  # deploy behind port-forward, use `http://127.0.0.1:8080/auth/callback`
  # and add that URI to the OAuth client. See docs/oauth-redirect-uri.md.
  OAUTH_REDIRECT_URI: "http://127.0.0.1:8080/auth/callback"
  LOG_LEVEL: "INFO"
  # LOG_LEVEL_ZASHIKI: "DEBUG"
  # LLM
  LLM_PROVIDER: "llamacpp"
  LLM_BASE_URL: "http://llama-server:8080/v1"
  LLM_API_KEY: "not-needed"
  LLM_MODEL: "local-model"
  # LLM_TEMPERATURE: "0.2"
  # LLM_ANALYZE_MAX_TOKENS: "10922"
  # Telegram
  TELEGRAM_API_BASE: "https://api.telegram.org"
  # TELEGRAM_TIMEOUT_SECONDS: "10"
  # Notion (leave commented to disable)
  # NOTION_TIMEOUT_SECONDS: "10"
  # NOTION_SYNC_INTERVAL_SECONDS: "300"
  # Gmail scopes / paths / tuning (all read via GmailSettings env_prefix=GMAIL_)
  GMAIL_CREDENTIALS_PATH: "/secrets/credentials.json"
  GMAIL_TOKEN_PATH: "/data/token.json"
  # GMAIL_HTTP_TIMEOUT_SECONDS: "60"
  # GMAIL_SCOPES: "https://www.googleapis.com/auth/gmail.readonly"
  # Checkpointer pool tuning (see db-connection-resilience spec).
  # Defaults are sized for a single-threaded homelab poller; raise
  # max_size for a chattier deployment.
  # DATABASE_CHECKPOINTER_POOL_MIN_SIZE: "1"
  # DATABASE_CHECKPOINTER_POOL_MAX_SIZE: "5"
  # DATABASE_CHECKPOINTER_POOL_MAX_LIFETIME_SECONDS: "1800"
  # DATABASE_CHECKPOINTER_POOL_MAX_IDLE_SECONDS: "600"
  # Log emission format: `text` (default one-liner) or `json`
  # (structured NDJSON — one JSON per line, ships trace_id/span_id
  # when OTel tracing is on). See docs/tracing-architecture.md.
  # LOG_FORMAT: "text"
  # ---------- OpenTelemetry tracing (v1.1, opt-in) ----------
  # Master switch. `1` initializes the SDK and connects to the
  # collector below. `0` (default) = no SDK import.
  OTEL_ENABLED: "0"
  # OTEL_SERVICE_NAME: "zashiki-warasi"
  # OTLP collector endpoint. Point at your in-cluster OTel Collector
  # Service. Example values for a typical kube-prometheus-stack
  # sibling deploy: `http://otel-collector.observability.svc.cluster.local:4317`
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  # OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  # OTEL_TRACES_SAMPLER_ARG: "1.0"
  # Extra resource attributes (k=v,k=v). SHALL NOT contain secrets
  # — app scans this at startup for known token prefixes + base64
  # shapes and refuses to boot on match. See design D22.
  # OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod"

# ---------- Secrets (rendered into a Secret) ----------
# Provide values via `--set secrets.databaseUrl=...` or a values file
# outside version control. Leave `""` to skip that key.
secrets:
  databaseUrl: ""                     # postgresql+psycopg://user:pw@host:5432/db — REQUIRED
  httpApiKey: ""                      # required whenever HTTP_BIND_HOST != 127.0.0.1
  telegramBotToken: ""
  telegramChatId: ""
  notionToken: ""
  notionExpenseDatabaseId: ""

# OAuth artifacts — inline the JSON contents (single line, escaped
# properly) OR supply via `--set-file`. Values here render into a
# Secret mounted read-only at /secrets and read-write at /data.
oauth:
  credentialsJson: ""                 # contents of credentials.json — REQUIRED
  tokenJson: ""                       # contents of token.json — optional (bootstrap via /reauth)

# ---------- Persistent storage for /data (token.json + future state) ----------
# accessMode note:
#   - ReadWriteOnce (RWO): default. Universally supported. Multi-node
#     `replicaCount > 1` is BLOCKED because a RWO PVC can only be
#     attached to one node at a time (MultiAttach error).
#   - ReadWriteMany (RWX): required for `replicaCount > 1` when pods
#     may land on different nodes. Requires an RWX-capable storage
#     class (Longhorn share-manager, NFS, CephFS, EFS, ...).
persistence:
  enabled: true
  storageClass: ""                    # "" = cluster default
  accessMode: ReadWriteOnce
  size: 100Mi

# ---------- Cron (external scheduler) ----------
cronjob:
  # Runs curl -X POST /poll against the Service. 60s is the cron
  # granularity floor; sub-minute would need multiple entries.
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # `curlimages/curl` is ~2 MB, no shell, no leftover state — ideal
  # for a per-minute one-shot pod.
  image:
    repository: curlimages/curl
    tag: "8.11.1"
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi

# ---------- Ingress (optional; off by default) ----------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: zashiki.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------- Pod security ----------
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# ---------- Observability (v1.1, opt-in, all default OFF) ----------
#
# Three independent knobs — turn on per your cluster's posture:
#
#   observability.serviceMonitor.enabled=true  → let kube-prometheus-
#     stack (or any Prometheus Operator install) scrape our /metrics
#   observability.prometheusRule.enabled=true  → ship the starter
#     alert bundle as a PrometheusRule CRD
#   observability.dashboards.enabled=true      → ship Grafana
#     dashboards as ConfigMaps for the kube-prom-stack Grafana
#     sidecar to auto-import
#
# Prometheus / Grafana / Alertmanager themselves are NOT deployed by
# this chart — they're expected to already exist in the cluster
# (kube-prometheus-stack). If the CRDs (ServiceMonitor, PrometheusRule)
# aren't installed, `helm upgrade` with these flags on will fail at
# `kubectl apply` time — install the Prometheus Operator first.
observability:
  serviceMonitor:
    enabled: false
    interval: 30s
    # Empty = scrape from same namespace only. For cross-namespace
    # scrape, set {matchNames: [<ns>]} or {any: true}.
    namespaceSelector: {}
    # Extra labels for kube-prometheus-stack's Prometheus to select
    # this SM. Common: `release: kube-prometheus-stack` — check what
    # your Prometheus CR's `serviceMonitorSelector` expects.
    additionalLabels: {}

  prometheusRule:
    enabled: false
    additionalLabels: {}
    # Starter alert bundle. Each alert has an independent `enabled`
    # toggle so operators can pick a subset without touching PromQL.
    # Threshold knobs (`ratePerMinute`, `for`) are exposed for tuning.
    # See docs/tracing-architecture.md + design D19 for rationale.
    alerts:
      tickNoSuccessfulTick:
        enabled: true
        for: 15m
        severity: warning
      tickErrorRateHigh:
        enabled: true
        for: 10m
        severity: warning
        # Errors per minute averaged over 5m. > 0.5 for 10m = trip.
        ratePerMinute: 0.5
      tickConflictRateHigh:
        enabled: true
        for: 10m
        severity: info
        # 409/min averaged over 5m. > 5 for 10m = trip.
        # Info-level: over-scheduling isn't a bug, just a signal.
        ratePerMinute: 5
      healthzUnhealthy:
        enabled: true
        for: 5m
        severity: critical
      oauthRefreshFailing:
        enabled: true
        for: 15m
        severity: warning
    # Append custom Prometheus alerting rules AFTER the starter set.
    # Each entry is a full rule dict: alert / expr / for / labels /
    # annotations. Additive — starter alerts stay unless individually
    # disabled above.
    additionalRules: []

  dashboards:
    enabled: false
    # kube-prometheus-stack's Grafana sidecar watches for ConfigMaps
    # with this label and auto-imports the JSON as a dashboard.
    # Override if your kube-prom-stack install uses a different label.
    sidecarLabel:
      key: grafana_dashboard
      value: "1"
    # Per-dashboard toggle. Disabling here removes the CM entirely →
    # the sidecar auto-removes the panel from Grafana on next
    # reconcile. No manual Grafana UI cleanup needed.
    overview:
      enabled: true
