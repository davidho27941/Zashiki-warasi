# Two Secrets: one for env-injected secret env vars, one for the OAuth
# JSON files (mounted read-only into /secrets). Split so credentials.json
# rotation doesn't require re-templating the whole env.

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zashiki-warasi.fullname" . }}
  labels:
    {{- include "zashiki-warasi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.httpApiKey }}
  HTTP_API_KEY: {{ .Values.secrets.httpApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramBotToken }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramChatId }}
  TELEGRAM_CHAT_ID: {{ .Values.secrets.telegramChatId | quote }}
  {{- end }}
  {{- if .Values.secrets.notionToken }}
  NOTION_TOKEN: {{ .Values.secrets.notionToken | quote }}
  {{- end }}
  {{- if .Values.secrets.notionExpenseDatabaseId }}
  NOTION_EXPENSE_DATABASE_ID: {{ .Values.secrets.notionExpenseDatabaseId | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zashiki-warasi.fullname" . }}-oauth
  labels:
    {{- include "zashiki-warasi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.oauth.credentialsJson }}
  credentials.json: |
    {{- .Values.oauth.credentialsJson | nindent 4 }}
  {{- end }}
  {{- if .Values.oauth.tokenJson }}
  token.json: |
    {{- .Values.oauth.tokenJson | nindent 4 }}
  {{- end }}
