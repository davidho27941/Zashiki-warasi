# GitLab CI — build + push the runtime container image on every push.
#
# Runner requirements (matches homelab template):
#   - Runner tagged `build` (shell / docker executor with dockerd access).
#   - Uses GitLab's built-in `$CI_REGISTRY_*` variables (auto-injected
#     on every job, job-scoped, no ref-protection dependency) to
#     authenticate to the project's own registry — no PAT or manual
#     CI/CD variables required.
#
# Tagging strategy:
#   - Every push builds and tags with the short commit SHA — smoke
#     runs (`helm install ... --set image.tag=<sha>`) always reference
#     an immutable ref.
#   - `main` branch pushes also update the `latest` tag for convenience
#     — never use `latest` in production values files (see chart's
#     values.yaml comment).
#   - Pushing a git tag (e.g. `v1.0.0`) additionally tags the image
#     with the tag name — this is the release path.

stages:
  - build

variables:
  IMAGE: gitlab.davidho.dev:5050/homelab/$CI_PROJECT_NAME
  # $CI_COMMIT_SHORT_SHA = 8-char stable ref, always populated.
  IMAGE_SHA: $IMAGE:$CI_COMMIT_SHORT_SHA
  # Advisory ceiling on the built image size (MB). v1.0 baseline
  # ~470 MB, v1.1 with observability deps ~494 MB. 600 MB gives ~20%
  # headroom for future intentional dep additions. When a real change
  # justifies bumping this, edit the number here — it's a lint, not
  # a hard architectural constraint. See CHANGELOG [1.1.0].
  IMAGE_SIZE_LIMIT_MB: "600"

Build_Image:
  tags:
    - build
  stage: build
  image: docker:27.0.3
  script:
    - echo "Building $IMAGE_SHA (branch=$CI_COMMIT_REF_NAME)"
    - docker build -t "$IMAGE_SHA" .
    # Image size guard — fails the build BEFORE we push a bloated
    # image to the registry. Adjust IMAGE_SIZE_LIMIT_MB in the top
    # `variables:` block if a real change justifies growing it.
    - |
      IMAGE_SIZE_BYTES=$(docker inspect --format='{{.Size}}' "$IMAGE_SHA")
      IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))
      echo "Image size: ${IMAGE_SIZE_MB} MB (limit: ${IMAGE_SIZE_LIMIT_MB} MB)"
      if [ "$IMAGE_SIZE_MB" -gt "$IMAGE_SIZE_LIMIT_MB" ]; then
        echo "ERROR: image size ${IMAGE_SIZE_MB} MB exceeds limit ${IMAGE_SIZE_LIMIT_MB} MB." >&2
        echo "If this growth is intentional, bump IMAGE_SIZE_LIMIT_MB in .gitlab-ci.yml." >&2
        exit 1
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_SHA"
    # Convenience `latest` on main only. Never rely on it in prod values.
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag "$IMAGE_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    # Release tag: pushing `git tag v1.0.0 && git push --tags` triggers
    # this and stamps the image with the exact tag name.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
