# Self-contained stack for users without an existing Postgres.
#
# What this gives you:
#   - postgres: a fresh Postgres 16 with a persisted volume
#   - app:      the poller, with alembic upgrade head run on boot
#
# What you must provide:
#   1. A `.env` (copy from `.env.example`) with LLM / Telegram / Notion creds
#   2. A `./credentials/credentials.json` from Google Cloud Console
#      (Desktop OAuth client). First boot needs an interactive auth flow
#      — see README §Docker.
#
# Users who already run their own Postgres should NOT use the postgres
# service — set DATABASE_URL in .env to point at the existing instance
# and run `docker compose up app` (compose will skip the postgres dep
# only if you also `docker compose --profile noop up app`; simpler:
# don't use compose, just `docker run` the image directly).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zashiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zashiki}
      POSTGRES_DB: ${POSTGRES_DB:-zashiki_warasi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns 0 only when Postgres is accepting
      # connections — using it as the gate means the app container
      # won't try alembic upgrade against a half-booted DB.
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-zashiki} -d ${POSTGRES_DB:-zashiki_warasi}
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the compose-managed postgres.
      # Anything in .env is overridden by this; remove it if you set
      # DATABASE_URL yourself in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zashiki}:${POSTGRES_PASSWORD:-zashiki}@postgres:5432/${POSTGRES_DB:-zashiki_warasi}
      # Token path inside the container — matches the volume below so
      # the refresh token persists across container restarts.
      GMAIL_TOKEN_PATH: /root/.config/zashiki-warasi/token.json
      GMAIL_CREDENTIALS_PATH: /app/credentials/credentials.json
    volumes:
      # OAuth client secret — host-managed, never baked into the image.
      - ./credentials:/app/credentials:ro
      # Refresh token cache — survives container rebuilds.
      - token_data:/root/.config/zashiki-warasi
    # Pass CLI flags via `docker compose run app --reset -y` or by
    # editing `command` here (default = no flags, normal poller boot).

volumes:
  postgres_data:
  token_data:
